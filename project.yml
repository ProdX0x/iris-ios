name: Iris
options:
  bundleIdPrefix: com.prodx0x
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: NKN63DTRM4
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    GCC_WARN_UNUSED_VARIABLE: "YES"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
targets:
  Iris:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Domain
      - path: GameEngine
      - path: AR
      - path: Audio
      - path: Navigation
      - path: Features
      - path: DesignSystem
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prodx0x.iris
        PRODUCT_NAME: Iris
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
  IrisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/IrisTests
    dependencies:
      - target: Iris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prodx0x.iris.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Iris.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Iris"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Iris:
    build:
      targets:
        Iris: all
        IrisTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IrisTests
      gatherCoverageData: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
