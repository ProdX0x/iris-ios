# Iris — spécification XcodeGen. CE FICHIER EST LA SOURCE DE VÉRITÉ du projet Xcode.
# `Iris.xcodeproj` est entièrement régénéré par `xcodegen generate` : tout réglage modifié
# dans Xcode (Signing & Capabilities, Build Settings) est ÉCRASÉ à la régénération suivante.
#
# Identité Apple verrouillée — NE PAS MODIFIER SANS RAISON EXPLICITE (voir README, « Apple Signing ») :
#   PRODUCT_BUNDLE_IDENTIFIER = net.steve-s.iris        (cible de tests : net.steve-s.iris.tests)
#   DEVELOPMENT_TEAM          = G4U9RG5GL7              (Stéphane SAULNIER, équipe individuelle Apple Developer)
#   CODE_SIGN_STYLE           = Automatic               (aucun profil ni certificat imposé)
# `Tools/audit.py` (contrôle C12) échoue si ces valeurs divergent entre ce fichier et le projet généré.
name: Iris
options:
  bundleIdPrefix: net.steve-s
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  developmentLanguage: fr
attributes:
  ORGANIZATIONNAME: Stéphane SAULNIER
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: G4U9RG5GL7
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    GCC_WARN_UNUSED_VARIABLE: "YES"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
targets:
  Iris:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Domain
      - path: GameEngine
      - path: AR
      - path: Audio
      - path: Haptics
      - path: Navigation
      - path: Features
      - path: DesignSystem
      - path: Commerce
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.steve-s.iris
        PRODUCT_NAME: Iris
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # Iris v1 est une application iPHONE. Aucun support iPad n'est revendiqué ni validé pour cette version.
        # La restriction vit sur la seule cible applicative ; les réglages de projet restent « 1,2 » pour les tests.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
      configs:
        # Release SEULEMENT — signature de distribution App Store, épinglée et déterministe.
        # Debug reste sur la signature de développement automatique définie plus haut (settings.base).
        # Profil : « Iris App Store Connect Distribution », UUID 43baa942-c5af-42c3-984a-882e3bcba19e,
        # App ID explicite G4U9RG5GL7.net.steve-s.iris, get-task-allow = false (il vient du profil, jamais écrit à la main).
        # NOTE : `Tools/audit.py` (contrôle C12) attend encore une signature automatique sans profil épinglé ;
        # il signalera donc cette configuration Release tant qu'il n'aura pas été mis à jour — décision hors de ce mandat.
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Iris App Store Connect Distribution
          DEVELOPMENT_TEAM: G4U9RG5GL7
  IrisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/IrisTests
    dependencies:
      - target: Iris
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.steve-s.iris.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Iris.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Iris"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Iris:
    build:
      targets:
        Iris: all
        IrisTests: [test]
    run:
      config: Debug
      # Local products for StoreKit testing. It never creates anything in App Store Connect.
      storeKitConfiguration: Config/Iris.storekit
    test:
      config: Debug
      # NOTE: XcodeGen 2.45.4 silently ignores `storeKitConfiguration` here — the generated TestAction carries no
      # StoreKitConfigurationFileReference (verified on the generated scheme). The unit tests do not need it: they
      # enable StoreKit testing themselves with `SKTestSession(contentsOf:)`. The key is left out deliberately.
      targets:
        - IrisTests
      gatherCoverageData: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
